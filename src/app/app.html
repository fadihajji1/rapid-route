@if (isLandingPage) {
  <!-- Landing page renders full-screen without the sidebar shell -->
  <router-outlet />
} @else {
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">RapidRoute</div>

      <nav class="nav">
        @for (item of navItems; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">{{ item.label }}</a>
        }
      </nav>
    </aside>

    <main class="content-panel">
      <router-outlet />
    </main>
  </div>
}
