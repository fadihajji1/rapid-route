@if (isLandingPage) {
  <!-- Landing page renders full-screen without the sidebar shell -->
  <router-outlet />
} @else {
  <div class="app-shell">
    <main
      class="content-panel"
      [class.auth-panel]="isAuthPage"
      [class.not-found-panel]="isNotFoundPage"
    >
      <router-outlet />
    </main>
  </div>
}
