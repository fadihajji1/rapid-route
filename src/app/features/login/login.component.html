<main class="login-page" [class.light-theme]="theme.isLightTheme">
  <svg class="glass-filter-defs" aria-hidden="true" focusable="false">
    <filter id="login-glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.012" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="3" result="softNoise" />
      <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="55" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="login-layout">
    <a routerLink="/" class="home-button">← Home</a>
    <section class="login-panel" aria-labelledby="login-title">
    <a routerLink="/" class="login-brand" aria-label="Return to RapidRoute home">
      <span class="login-brand-mark" aria-hidden="true">R</span>
      <span>RapidRoute</span>
    </a>

    <div class="login-heading">
      <p class="login-eyebrow">Welcome back</p>
      <h1 id="login-title">Sign in to your account</h1>
      <p>Keep every delivery moving with one connected view.</p>
    </div>

    <form class="login-form" (ngSubmit)="submit()" #loginForm="ngForm" novalidate>
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        [(ngModel)]="username"
        autocomplete="username"
        placeholder="Enter your username"
        required
      />

      <div class="password-label-row">
        <label for="password">Password</label>
        <a href="#" class="forgot-link" (click)="$event.preventDefault()">Forgot password?</a>
      </div>
      <div class="password-field">
        <input
          id="password"
          name="password"
          [type]="passwordVisible ? 'text' : 'password'"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
          (click)="passwordVisible = !passwordVisible"
        >
          {{ passwordVisible ? 'Hide' : 'Show' }}
        </button>
      </div>

      @if (errorMessage) {
        <p class="login-error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" class="login-submit" [disabled]="submitting || loginForm.invalid">
        {{ submitting ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

      <p class="login-footer">
        New to RapidRoute? <a routerLink="/register">Create an account</a>
      </p>
    </section>
  </div>
</main>
