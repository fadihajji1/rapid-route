<main class="not-found-page" [class.light-theme]="theme.isLightTheme" aria-labelledby="not-found-title">
  <div class="not-found-orbit orbit-one" aria-hidden="true"></div>
  <div class="not-found-orbit orbit-two" aria-hidden="true"></div>

  <section class="not-found-content">
    <p class="not-found-code">404</p>
    <p class="not-found-eyebrow">Route unavailable</p>
    <h1 id="not-found-title">This delivery route took a wrong turn.</h1>
    <p class="not-found-message">
      The page you are looking for does not exist or may have moved.
    </p>
    <a routerLink="/" class="not-found-action">Return to RapidRoute</a>
  </section>
</main>
